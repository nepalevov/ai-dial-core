name: Release Workflow

on:
  push:
    branches: [development, release-*]
  workflow_dispatch:
    inputs:
      promote:
        type: boolean
        default: false
        description: Promote release to stable (for release-* branches only)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # Polygon only (never for the epam PR): the shared workflow comes from the nepalevov/ci fork, whose main is the test ref
    uses: nepalevov/ci/.github/workflows/java_release.yml@main
    with:
      promote: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
      platforms: "linux/amd64"
      java-version: 21
      trivy-severity: "CRITICAL,HIGH,MEDIUM,LOW"
      trivy-severity-for-sarif: "CRITICAL,HIGH,MEDIUM,LOW"
      dockerhub-enabled: false # the fork has no Docker Hub secrets
      publish-enabled: true
      # The fork run only needs to reach the publish step, so its checks are off
      style-checks-enabled: false
      code-checks-enabled: false
      ort-enabled: false
      trivy-enabled: false
    secrets: inherit
